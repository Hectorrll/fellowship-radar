name: Apply Engine

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apply-engine
  cancel-in-progress: false

jobs:
  apply-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr Apply Engine
        env:
          NVIDIA_FELLOW_KEY_1: ${{ secrets.NVIDIA_FELLOW_KEY_1 }}
          NVIDIA_FELLOW_KEY_2: ${{ secrets.NVIDIA_FELLOW_KEY_2 }}
          NVIDIA_FELLOW_KEY_3: ${{ secrets.NVIDIA_FELLOW_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPLY_MAX_POR_CORRIDA: '5'
          APPLY_PREFIX: '[APPLY]'
        run: python apply_engine.py

      - name: Guardar cola y seen
        run: |
          git config user.name "apply-engine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apply_queue.json seen-apply.json
          if git diff --cached --quiet; then
            echo "sin cambios en cola/seen"
            exit 0
          fi
          git commit -m "apply-engine: actualizar cola y vistos"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "cola/seen guardados (intento $i)"
              exit 0
            fi
            echo "push fallo, reintento $i..."
            sleep 4
          done
          echo "ERROR: no se pudo guardar cola/seen tras 5 intentos"
          exit 1
